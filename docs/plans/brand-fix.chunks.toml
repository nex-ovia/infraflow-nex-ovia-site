# ---------- wave C ----------

[[chunk]]
id = "G3"
title = "Wire GitHub data into the build"
file = "tools/nxsite/main.go (+ a test)"
model = "sonnet"
do = """
In Build, after the Blog handling and before the page loop:
- const toolTopic = "nex-ovia-tool"; var toolOwners = []string{"srivastava-ami", "nex-ovia"}; const nxsRepo =
  "nex-ovia/NXS" (package-level).
- online := os.Getenv("NXSITE_OFFLINE") != "1"; gh := GitHub{Token: os.Getenv("GITHUB_TOKEN")}. Allow tests to
  point at a fake server: if os.Getenv("NXSITE_GITHUB_API") != "" use it as gh.API.
- Lazily fetch (at most once per build, only if some page needs it): repos via gh.ToolRepos(toolOwners,
  toolTopic), versions via gh.Versions(nxsRepo).
In the page loop, when online:
- if the page contains "<!-- github:tools -->": repos fetched without error and len > 0 -> ReplaceRegion(...,
  "tools", ToolCards(repos)); otherwise keep the fallback and print one warning line to stderr.
- if the page contains "<!-- github:nxs-versions -->": same with VersionList(versions, nxsRepo).
- if the page contains "data-nxs-version" and versions are available: FillText(html, "data-nxs-version",
  versions[0].Tag).
A GitHub failure never fails the build (static fallback stays).
Test: run Build against a temp root whose page has both regions and a data-nxs-version span, with
NXSITE_GITHUB_API pointing at an httptest server (reuse canned data style from github_test.go); assert the output
contains the fake repo's card, the fake version, and that with NXSITE_OFFLINE=1 the fallback stays.
"""
validate = "grep -q 'nex-ovia-tool' tools/nxsite/main.go && {validate_all}"
