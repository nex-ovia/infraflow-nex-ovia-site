name: security

on:
  pull_request:
  push:
    branches: [dev]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (binary, checksum-verified)
        env:
          V: "8.28.0"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          curl -sSLO "${base}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSLO "${base}/gitleaks_${V}_checksums.txt"
          grep "gitleaks_${V}_linux_x64.tar.gz" "gitleaks_${V}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --no-banner .

  workflow-lint:
    name: actionlint · zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24"
          cache: false
      # The legacy Azure workflow is excluded; it is deleted at cutover (chunk C04).
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/infra.yml .github/workflows/site.yml .github/workflows/security.yml .github/workflows/social.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: zizmor
        run: pip install --quiet zizmor==1.16.0 && zizmor --min-severity medium .github/workflows/infra.yml .github/workflows/site.yml .github/workflows/security.yml .github/workflows/social.yml
