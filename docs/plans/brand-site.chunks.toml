- partials/footer.html: Standard, Principles, Tools, AI, About, Work with me, Changelog, GitHub, LinkedIn
  (https://www.linkedin.com/in/srivastava-ami).
- content/site.toml: uncomment the LinkedIn same_as line with https://www.linkedin.com/in/srivastava-ami ;
  description = "Amit Srivastava on AI-driven delivery leadership, the Nexovia Standard (NXS) and the open-source tools built on it."
- tools/nxsite: the build adds Blog after /tools via AddLinkAfter; keep that working (Blog lands after Tools).
- nav must not overflow at 390px: if site.css has a mobile nav pattern, keep it; otherwise allow wrapping.
"""
