bio_h2 = "Short bio"
bio_note = "For hosts and event pages; copy freely."
bio = "Amit Srivastava is a CX engineering leader with 13 years across implementation, solutions engineering and customer success at global SaaS companies. He is the author of the Nexovia Standard (NXS), an open standard for delivery sovereignty in the AI era, and builds open-source tools including genome and coderev. He lives in Sacramento, California."
cta_h2 = "Get in touch"
cta_body = "LinkedIn is the fastest way to reach me. Say what you have in mind and when."
cta_primary = { label = "Message me on LinkedIn", href = "https://www.linkedin.com/in/srivastava-ami" }
cta_secondary = { label = "GitHub", href = "https://github.com/srivastava-ami" }
validate = "test -f work-with-me/index.html && {validate_all}"

[[chunk]]
id = "B5"
title = "Rewrite /tools around shipped open-source work"
file = "tools/index.html"
do = """
Keep the page's head, CSS and card component. Replace the hero and the cards.
Hero: label "Open source", h1 "Tools I build and use every day.", lead "Everything here is open, built on NXS and
used in my own delivery work. If one helps you, a GitHub star is the best way to say so — it helps others find it."
Hero buttons: primary "Star NXS on GitHub" -> https://github.com/nex-ovia/NXS ; secondary "Follow nex-ovia" -> https://github.com/nex-ovia
Cards (in this order), each footer has a primary-style "★ Star on GitHub" button linking to the repo and a secondary
link to docs/site where given:
1 genome — status "available · experimental". Tagline: "Understand any system without reading its code."
  Body: "genome turns one editable nexovia.toml into a self-contained, offline HTML map of your project: its
  architecture, every module, what each part does and why, so architects, engineers and executives can see it,
  question it and approve it in the browser." Features: "Offline, read-only HTML map", "Exec, architecture and
  engineering views", "Prebuilt for Linux, macOS and Windows", "Install: curl -fsSL https://genome.nex-ovia.com/install.sh | sh"
  Repo https://github.com/nex-ovia/genome · site https://genome.nex-ovia.com
2 coderev — status "available · v0.30". Tagline: "One command to scan your code, map it, and get an AI review."
  Body: "Deterministic static analysis and rules run first; a bounded AI review runs second, so the AI only sees what
  matters." Features: "brew install srivastava-ami/tools/coderev", "No Python, no Node, no config file", "Rules
  first, AI second". Repo https://github.com/srivastava-ami/coderev
3 NXS — status "v1.0 · open standard". Tagline: "The Nexovia Standard: four rules for solutions that last."
  Body: "An open delivery standard for the AI era: logic separate from tools, configuration externalised,
  dependencies visible, runs anywhere for anyone." Repo https://github.com/nex-ovia/NXS · docs /standard
4 pr-watch — status "available · v0.1". Tagline: "Know when a PR needs you." Body: "macOS notifications for PRs
  assigned to you and for new commits pushed after your review. Runs every 15 minutes via launchd."
  Repo https://github.com/srivastava-ami/pr-watch
5 nex-ovia.com — status "open source". Tagline: "This website, built the way I describe on /ai." Body: "Hand-written
  HTML plus TOML content, a small Go builder, Terraform on Cloudflare, and every change gated by tests and approval."
  Repo https://github.com/nex-ovia/infraflow-nex-ovia-site · link /ai
Delete the old "NXS Site", "NXS CLI" and any other planned/roadmap cards. No star counts.
"""
validate = "grep -q 'github.com/srivastava-ami/coderev' tools/index.html && ! grep -q 'NXS CLI' tools/index.html && {validate_all}"

