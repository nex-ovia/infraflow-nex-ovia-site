  { name = "Talks and workshops", body = "The NXS standard and the plan → chunk → dispatch → validate → approve operating model, with live examples from real repositories." },
  { name = "Advisory", body = "Set up governed AI delivery in your team: shared agent context, approval gates, least-privilege workers, and measurable delivery metrics." },
  { name = "Tool adoption", body = "Pilot genome or coderev on your codebase. I'll help you get running and turn your feedback into the roadmap." },
