[[chunk]]
id = "B9"
title = "Redirect the removed sponsor URL"
do = """
infra/rules.tf, ruleset "redirects": add a rule after apex_to_www, ref "sponser_to_work", expression
'(http.host eq "${var.site_host}" and starts_with(http.request.uri.path, "/sponser"))', 301 to
concat("https://${var.site_host}", "/work-with-me/"). Follow the existing rule's exact shape.
Add an assertion in infra/tests/stack.tftest.hcl only if existing tests already assert individual redirect rules.
"""
validate = "cd infra && terraform fmt -check && grep -q sponser_to_work rules.tf"

[[chunk]]
id = "B1b"
title = "Old sponsor paths all land on /work-with-me"
do = """
1. infra/rules.tf ruleset "redirects": change rule sponser_to_work's expression so it matches BOTH spellings:
   '(http.host eq "${var.site_host}" and (starts_with(http.request.uri.path, "/sponser") or starts_with(http.request.uri.path, "/sponsor")))'
   and description "Removed sponsor paths -> work-with-me". Delete the rule with ref "sponser_typo" entirely.
2. tools/nxsite/headers.go: where the _redirects lines are produced (the "/sponser /sponsor/ 301" lines were removed
   earlier), add these four lines in the same format:
     /sponser    /work-with-me/  301
     /sponser/*  /work-with-me/  301
     /sponsor    /work-with-me/  301
     /sponsor/*  /work-with-me/  301
   and assert one of them in tools/nxsite/headers_test.go following the existing test style.
"""
validate = "cd infra && terraform fmt -check && ! grep -q sponser_typo rules.tf && cd .. && grep -q 'work-with-me/  301' tools/nxsite/headers.go && {validate_all}"

[[chunk]]
id = "B10"
title = "Mobile nav without JS"
do = """
site.css only. Today the @media rule near line 150 sets .nav-links { display: none; } so phones get no navigation.
Replace that with a CSS-only layout for widths <= 720px: the nav container wraps; .nav-links becomes a full-width
single row under the logo with overflow-x: auto, white-space: nowrap, no visible scrollbar
(scrollbar-width: none; ::-webkit-scrollbar { display: none; }), gap 0, links padding 0.5rem 0.625rem,
font-size 0.8125rem; the .highlight item stays visibly highlighted. The page itself must not scroll horizontally
(document scrollWidth == viewport width at 390px). Desktop (> 720px) must look exactly as before. No JS, no HTML change.
If the fixed/sticky nav height changes on mobile, make sure page content is not hidden under it (adjust the mobile
top padding rule that offsets the nav, if one exists).
"""
validate = "! grep -qE '\\.nav-links \\{ display: none; \\}' site.css && {validate_all}"

[[chunk]]
id = "B11"
title = "Home uses the shared footer"
do = """
index.html has a hard-coded <footer>…</footer> (around line 1059) with stale links. Replace that whole element with
the same placeholder the other pages use: <div id="footer-placeholder"></div> (see tools/index.html). Remove CSS in
index.html that only styled the removed hard-coded footer if site.css already styles the shared footer; keep it if
the shared footer relies on it. Nothing else changes.
"""
validate = "grep -q 'footer-placeholder' index.html && ! grep -q '<footer' index.html && {validate_all} && grep -q 'work-with-me' dist/site/index.html"

[[chunk]]
id = "B12"
title = "Favicon on every page"
do = """
1. Add favicon.svg at the repo root: a 64x64 viewBox rounded square (rx 14) filled #6c63ff with the letters "nx"
   centered in #0a0a0f, font-family 'DM Serif Display', Georgia, serif, font-size 34, font-weight 700. Plain SVG, no
   scripts, no external references.
2. tools/nxsite: make the build copy favicon.svg into the output root (follow how site.css/shared.js are copied), and
   make HeadTags (head.go) emit <link rel="icon" href="/favicon.svg" type="image/svg+xml"> so every page, including
   generated blog pages and 404.html, gets it. Update head_test.go / build_test.go to assert both.
"""
validate = "test -f favicon.svg && {validate_all} && test -f dist/site/favicon.svg && grep -q 'favicon.svg' dist/site/about/index.html"

[[chunk]]
id = "B10b"
title = "Mobile: Work with me first"
do = """
site.css, inside the existing mobile media query (<= 720px) that styles .nav-links: give .nav-links .highlight
order: -1 so the highlighted "Work with me" item is the first, always-visible link on phones. Desktop unchanged.
Nothing else changes.
"""
validate = "grep -qE 'highlight[^}]*order: *-1' site.css && {validate_all}"

[[chunk]]
id = "B13"
title = "Logo on the site + press kit"
do = """
Brand assets already exist in brand/ (do not edit them): nex-ovia-mark.svg (dark bg), nex-ovia-mark-light.svg,
nex-ovia-mark-white.svg, nex-ovia-mark-black.svg, nex-ovia-symbol.svg (no letters, small sizes), avatar-1080.png,
linkedin-banner-1584x396.png, x-header-1500x500.png, youtube-banner-2560x1440.png.
1. tools/nxsite: the build copies the whole brand/ directory to the output root (/brand/...), except generate-mark.py.
2. Favicon: replace the root favicon.svg content with the contents of brand/nex-ovia-symbol.svg (same file name, so
