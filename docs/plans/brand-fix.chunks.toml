   genome status "beta · v0.1.0-alpha.1"; footer note "nex-ovia/genome · BSL-1.1 (source-available)".
   coderev status "beta · v0.30.4"; footer note "srivastava-ami/coderev · BSL-1.1 (source-available)".
   pr-watch status "beta · v0.1.0"; footer note "srivastava-ami/pr-watch · MIT (open source)".
