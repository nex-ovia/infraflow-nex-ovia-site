   ("Logo, dark backgrounds (SVG)"), /brand/nex-ovia-mark-light.svg ("Logo, light backgrounds (SVG)"),
   /brand/nex-ovia-mark-white.svg ("Logo, one colour white (SVG)"), /brand/avatar-1080.png ("Square avatar (PNG)").
