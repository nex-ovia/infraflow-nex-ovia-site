cta_h2 = "Get in touch"
cta_body = "LinkedIn is the fastest way to reach me. Say what you have in mind and when."
cta_primary = { label = "Message me on LinkedIn", href = "https://www.linkedin.com/in/srivastava-ami" }
cta_secondary = { label = "GitHub", href = "https://github.com/srivastava-ami" }
