# brand-fix: fixes from reports/Nexovia website independent review.md (P0) plus owner requests 2026-11-24:
# - tools are beta, the website is not; NXS is a living framework whose versions come from GitHub
# - tool list, versions, licenses and stars come from GitHub at build time; a repo with topic `nex-ovia-tool`
#   (owners srivastava-ami, nex-ovia) appears on /tools automatically; the site rebuilds daily
# Facts: genome and coderev are BSL 1.1 (source-available), pr-watch MIT, NXS Apache-2.0.
# NXS tags: v2.0 (2026-09-02, "NXS v2.0 - Outcome-first, simple, and readable"), v0.1.0 (2026-05-10,
# "Nexovia Standard Release v0.1.0").

[shared]
voice = """
First person, plain words, short sentences. Never "project manager". Never call genome or coderev "open source"
(they are source-available, BSL 1.1). No inline style attributes, no inline scripts (strict CSP). Keep existing
classes and structure unless told otherwise. Use the copy text exactly as given.
"""
validate_all = "cd tools && GOTOOLCHAIN=local NXSITE_OFFLINE=1 go test ./... && mkdir -p ../dist && go build -o ../dist/.nxsite ./nxsite && cd .. && NXSITE_OFFLINE=1 dist/.nxsite build -root . -out dist/site && dist/.nxsite check -out dist/site"

# ---------- wave A: independent ----------

[[chunk]]
id = "G1"
title = "GitHub client: tool repos by topic, and tag versions"
file = "tools/nxsite/github.go (new) + tools/nxsite/github_test.go (new)"
model = "sonnet"
do = """
Create tools/nxsite/github.go (package main, stdlib only):

type Repo struct {
    Name, FullName, Description, Homepage, URL, License string
    Stars      int
    Version    string // tag of the newest release, prereleases included; "" if none
    Date       string // YYYY-MM-DD of that release
    Prerelease bool
}
type Version struct{ Tag, Date, Title string } // Title = first line of the tag (or commit) message

type GitHub struct {
    Client *http.Client // nil -> &http.Client{Timeout: 10 * time.Second}
    Token  string       // optional; sent as "Authorization: Bearer <token>"
    API    string       // "" -> "https://api.github.com"
}

func (g GitHub) get(path string, v any) error
    GET API+path with header Accept: application/vnd.github+json (+ auth if Token). Non-200 -> error naming path
    and status. JSON-decode body into v.

func (g GitHub) ToolRepos(owners []string, topic string) ([]Repo, error)
    One search: /search/repositories?q=topic:<topic>+user:<o1>+user:<o2>...&sort=stars&order=desc&per_page=100
    (build q with url.QueryEscape on each term joined by "+"). Skip items with archived or fork true.
    Map fields: name, full_name, description, homepage, html_url, stargazers_count, license.spdx_id.
    Per repo: /repos/<full>/releases?per_page=1 -> if one exists: Version=tag_name, Date=published_at[:10],
    Prerelease=prerelease.
    License: if spdx_id is "" or "NOASSERTION", GET /repos/<full>/license (field "content", base64 with newlines);
    decoded text containing "Business Source License" -> "BSL-1.1"; otherwise leave "". A 404 on /license -> "".
    Any other error -> return it.

func (g GitHub) Versions(repo string) ([]Version, error)
    /repos/<repo>/tags?per_page=100 gives name + commit.sha. For each tag GET /repos/<repo>/git/ref/tags/<name>:
    object.type "tag" -> GET /repos/<repo>/git/tags/<object.sha> -> Date=tagger.date[:10], Title=first line of
    message; otherwise GET /repos/<repo>/commits/<commit.sha> -> commit.committer.date[:10] and first line of
    commit.message. Trim Title. Return sorted by Date descending (stable; ties keep API order).

github_test.go: httptest.NewServer with a mux serving canned JSON for: the search (one normal repo with
spdx_id "NOASSERTION" whose license content is base64 of "Business Source License 1.1", one archived repo),
its releases (one prerelease v0.1.0-alpha.1), a repo with spdx "MIT" and no releases, and Versions for a repo with
one annotated tag (2026-09-02) and one lightweight tag (2026-05-10). Assert all mapped fields, the skipped
archived repo, BSL-1.1, and Versions order. No real network.
"""
validate = "test -f tools/nxsite/github.go && grep -q 'func (g GitHub) ToolRepos' tools/nxsite/github.go && grep -q 'func (g GitHub) Versions' tools/nxsite/github.go && {validate_all}"

