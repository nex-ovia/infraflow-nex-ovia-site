# brand-site: personal brand hub for Amit Srivastava (NXS + AI-driven leadership).
# Every fact below comes from user-authored public sources:
#   github.com/srivastava-ami (profile README), srivastava-ami.github.io/resume.toml, repo READMEs.
# Do not add facts, numbers, testimonials, logos, client names or star counts that are not here.

[shared]
page_template = """
New pages copy the structure of tools/index.html exactly:
- same <head> pattern: charset, viewport, <title>X — Nexovia</title>, <meta name="description">, the same Google Fonts
  <link> lines, <link rel="stylesheet" href="/site.css">, then a page-local <style> block.
- <body> starts with <div id="nav-placeholder"></div>, ends with <div id="footer-placeholder"></div> (copy the exact
  placeholder markup tools/index.html uses) and <script src="/shared.js"></script>.
- hero uses <div class="page-hero"> + <div class="container"> + <p class="section-label"> + <h1 class="animate-hero">.
- body sections are <section><div class="container">…</div></section>; cards/blocks get class "reveal".
- buttons: <a class="btn btn-primary"> / <a class="btn btn-secondary">. External links get
  rel="noopener noreferrer" target="_blank".
- page-local CSS uses only existing CSS variables from site.css (--surface, --border, --radius, --accent,
  --accent-2, --text, --muted or whatever names site.css actually defines; check). No inline style="" attributes
  (strict CSP), no inline <script>, no new external hosts.
- must read well at 390px wide: grids collapse to one column under 720px; no horizontal overflow.
"""
contact = """
Contact channels (only these): LinkedIn https://www.linkedin.com/in/srivastava-ami ,
GitHub https://github.com/srivastava-ami , GitHub org https://github.com/nex-ovia .
No email address anywhere (pending owner approval).
"""
validate_all = "cd tools && GOTOOLCHAIN=local go test ./... && mkdir -p ../dist && go build -o ../dist/.nxsite ./nxsite && cd .. && dist/.nxsite build -root . -out dist/site && dist/.nxsite check -out dist/site"

[[chunk]]
id = "B1"
title = "Remove sponsor completely"
do = """
Remove every trace of sponsorship from the site:
- delete the directory sponser/ and content/sponser.toml
- partials/nav.html: delete the <li class="highlight"> Sponsor item
- partials/footer.html: delete the Sponsor link
- index.html: delete the sponsor section (comment '[build_pages node] → sponsor', source content/home.toml
  [sponsor_strip]) and any CSS rules in index.html used only by it
- content/home.toml: delete the [sponsor_strip] table
- site.css: delete .btn-sponsor and any rule used only by sponsor markup
- any other page (standard/, principles/, tools/, changelog/) linking to /sponser or github.com/sponsors:
  delete that link/element
- tools/nxsite: if normalizeLinks or tests reference /sponser, remove that special case and its test lines
Do not add anything new.
"""
validate = "! grep -rniE 'sponsor|sponser' --include=*.html --include=*.css --include=*.toml --include=*.go --include=*.js . | grep -v '^./docs/' && {validate_all}"

