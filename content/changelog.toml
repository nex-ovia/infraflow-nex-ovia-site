description = "Version history of the Nexovia Standard."

[[release]]
version     = "1.0"
date        = "May 2026"
status      = "current"
summary     = "Initial publication of the Nexovia Standard."
description = "NXS v1.0 establishes delivery sovereignty as the core principle and defines the four rules every compliant solution must follow. This version also defines the Definition of Done checklist and the four commercial metrics for measuring delivery quality."

