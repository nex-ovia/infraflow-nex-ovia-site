# coderev — project manifest. Always-loaded context is [context] + [rules] only.
# Everything else is pulled on demand through [pull]: load a key only when the task needs it.

[context]
what     = "Go 1.22 CLI that scans code and reviews PRs (cobra; module github.com/srivastava-ami/coderev)"
branch   = "dev — the only branch to commit/push"
build    = "go build ./... && go test ./...  (baseline 2026-11-23: 13 pkgs ok, 0 FAIL)"
layout   = "cmd/coderev (CLI) · internal/analysis (finding, runner) · internal/tools/* (adapters) · internal/report (md/html/sarif) · internal/llm · internal/output/ghpr · internal/github"
active   = "planned.nexovia-site (in progress, waiting on user setup) → planned.nexovia-coderev-page → planned.coderev-80-20"

[rules]
plan_first     = "write [planned.<name>] + HTML review page; build only after an explicit 'yes'"
chunks         = "one function per chunk; tests ship in the same chunk; each chunk has a validate gate"
dispatch       = "code chunks → haiku via dispatcher (none in repo yet: run inline with the same gates until a path is given)"
language       = "tools are written in Go"
shell_output   = "redirect to .tmp/<cmd>.log; read back one summary line"
commits        = "no Co-Authored-By, no 'Generated with' lines; never push feature branches"
excluded_input = "nothing from helpshift-solutions (golden PR #8 replaced by synthetic fixture C61)"
context_hygiene = "do not read whole files when a [pull] pointer or grep answers it; graphify query when graphify-out/ exists"

# On-demand pointers: key → where the detail lives. Load only the keys the current task needs.
[pull]
plan_page        = "docs/plans/coderev-80-20.html  (published: https://claude.ai/artifact/STwoYfQ3nnPtY1JnT7rN8G)"
site_plan_chunks = "docs/plans/nexovia-site.chunks.toml"
plan_chunks      = "docs/plans/coderev-80-20.chunks.toml  — read only the [[chunk]] ids being executed"
gap_table        = "plan_page § Gap table (stage → exists/partial/missing + file:line)"
finding_model    = "internal/analysis/finding.go:14"
rule_dsl         = "docs/TOML_PATTERN_DSL.md; matcher at internal/tools/treesitter/pattern_matcher.go:155"
diff_lines_today = "internal/output/ghpr/annotate.go:138 (has \\ No newline off-by-one; fixed by C09/C11)"
llm_today        = "internal/llm/llm.go:16 (Provider), internal/llm/context.go:237 (prompt)"
ocr_cli          = "ocr v1.14.2 via npm @alibaba-group/open-code-review (Apache-2.0); `ocr <cmd> --help > .tmp/ocr_<cmd>.help`"
ocr_session_spec = "github.com/alibaba/open-code-review internal/session/persist.go @ v1.14.2 — fetch before chunk C47"
site_template    = "github.com/nex-ovia/pages-template (site/ + .github/workflows/pages.yml + setup.sh)"
site_reference   = "github.com/nex-ovia/genome site/ (live: genome.nex-ovia.com) and nex-ovia/nx-viz site/"
site_hub         = "nex-ovia/infraflow-nex-ovia-site @ branch dev → Azure Static Web Apps (dist/), Cloudflare DNS proxied in front (NS ainsley/olof.ns.cloudflare.com). main is a stale older site. Content: content/*.toml + hand-kept *.html; nav/footer in partials/"
site_seo_audit   = "2026-11-23: no sitemap.xml (404 = default Azure SWA page), no canonical, og:url apex vs www mismatch, no og:image/twitter card, no JSON-LD, nav injected by JS, no blog/RSS, robots.txt is Cloudflare-managed (search=yes, ai-train=no)"

[planned.coderev-80-20]
status       = "awaiting-approval"
goal         = "PR review pipeline: ~80% deterministic (S1 ingest → S9 guarded post) + ~20% bounded, schema-validated LLM"
entrypoint   = "coderev pr <pr-url | branch | base..head> [--runtime scenarios.toml] [--llm off|provider|ocr] [--max-llm-tokens N] [--post --confirm]"
code_root    = "internal/pr/… (existing `coderev .` scan untouched)"
chunks       = "64 (C01–C64) in [pull].plan_chunks"
acceptance   = "C62 synthetic golden: recall ≥10/12 + 2 outside-diff, 0 bad anchors, REQUEST_CHANGES, no attribution, 5 suggestion blocks; C63 ocr round-trip"
open         = ["S5 runtime harness now or later?", "default LLM engine: existing provider or ocr?"]

[planned.nexovia-site]
