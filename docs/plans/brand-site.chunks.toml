[[chunk]]
id = "B7"
title = "Nav, footer, identity metadata"
do = """
- partials/nav.html links in order: Standard, Principles, Tools, AI (/ai), About (/about), and a highlighted last item
  "Work with me" (/work-with-me) using the class the old Sponsor item used (li.highlight). Keep Changelog out of the
