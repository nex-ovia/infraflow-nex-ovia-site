title = "New page /work-with-me"
file = "work-with-me/index.html"
title_tag = "Work with me — Nexovia"
meta_description = "Invite Amit Srivastava for an interview, podcast or talk, or get help adopting AI-driven delivery and the open-source Nexovia tools."
hero_label = "Work with me"
hero_h1 = "Let's build something that lasts."
hero_lead = "I'm open to conversations with teams and media working on AI-era delivery. Pick what fits and reach out on LinkedIn."
offers = [
