# ---------- wave B ----------

[[chunk]]
id = "G2"
title = "Render GitHub data: tool cards, version list, region and text fill"
file = "tools/nxsite/ghrender.go (new) + tools/nxsite/ghrender_test.go (new); tools/nxsite/metrics.go"
model = "sonnet"
do = """
Create tools/nxsite/ghrender.go (uses Repo and Version from github.go). Escape every GitHub string with
html.EscapeString.

func Beta(r Repo) bool: true if r.Prerelease, or r.Version == "", or the major number is 0 (strip a leading "v",
take text before the first ".").

func LicenseLabel(id string) string: "" -> "license not stated"; "BSL-1.1" -> "BSL-1.1 (source-available)";
"MIT", "Apache-2.0", "BSD-3-Clause", "BSD-2-Clause", "MPL-2.0", "GPL-3.0", "AGPL-3.0" -> id + " (open source)";
anything else -> id.

func ToolCards(repos []Repo) string: one card per repo, same markup as the existing cards in tools/index.html:
<div class="tool-card available reveal">
  <div class="tool-header">
    <div>
      <h2 class="tool-name">{Name}</h2>
      <p class="tool-tagline">{Description}</p>
    </div>
    <span class="status status-available">{status}</span>
  </div>
  <div class="tool-body">
    <ul class="tool-features">
      <li>Latest release: {Version} · {Date}</li>        (omit li when Version == "")
      <li>License: {LicenseLabel}</li>
      <li>GitHub stars: {Stars}</li>
    </ul>
  </div>
  <div class="tool-footer">
    <span class="tool-footer-note">{FullName}</span>
    <div class="tool-actions">
      <a href="{URL}" class="btn btn-primary" rel="noopener noreferrer" target="_blank">★ Star on GitHub</a>
      <a href="{Homepage}" class="btn btn-secondary" rel="noopener noreferrer" target="_blank">Visit site →</a>
    </div>
  </div>
</div>
status = "beta · " + Version when Beta and Version != ""; "beta" when Version == ""; Version otherwise.
Omit the Visit site link when Homepage is "" or equals URL. Only http(s) Homepage values are linked.

func VersionList(vs []Version, repo string) string: one block per version, exactly this markup; the first one
gets the Current status span, the others none:
<article class="release-card reveal">
  <div class="release-meta">
    <div class="release-version">{Tag}</div>
    <div class="release-date">{Date}</div>
    <span class="status status-available">Current</span>
  </div>
  <p class="release-summary">{Title}</p>
  <p><a href="https://github.com/{repo}/releases/tag/{Tag}" rel="noopener noreferrer" target="_blank">View on GitHub</a></p>
</article>
(url.PathEscape the tag in the href.)

func ReplaceRegion(html, name, body string) (string, bool): replaces everything between "<!-- github:"+name+" -->"
and "<!-- /github:"+name+" -->" with "\\n"+body+"\\n", keeping both markers. false (html unchanged) if either
marker is missing.

func FillText(html, attr, value string) string: sets the text content of every element whose start tag contains
the attribute `attr` (bare or with a value) to html.EscapeString(value). In metrics.go make FillMetricDate call
FillText(html, "data-metric-date", date) and delete metricDateRe if unused.

ghrender_test.go: table tests for Beta (v0.30.4 true, v1.2.0 false, prerelease v1.0.0-rc1 true, "" true),
LicenseLabel, ToolCards (escaping of "<b>", Visit link presence/absence, status text), VersionList (Current only
on first, href), ReplaceRegion (both markers kept, missing marker -> false), FillText. Existing metrics tests must
still pass.
"""
validate = "grep -q 'func ToolCards' tools/nxsite/ghrender.go && grep -q 'func ReplaceRegion' tools/nxsite/ghrender.go && {validate_all}"

