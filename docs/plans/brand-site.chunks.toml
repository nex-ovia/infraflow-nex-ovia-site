[[chunk]]
id = "B3"
title = "New page /ai — How I lead with AI"
file = "ai/index.html"
title_tag = "How I lead with AI — Nexovia"
meta_description = "How Amit Srivastava runs software delivery with AI agents: plan, chunk, dispatch, validate, approve. A repeatable, governed workflow anyone can copy."
hero_label = "AI-driven leadership"
hero_h1 = "AI writes the code. I own the outcome."
hero_lead = "I lead delivery with AI agents every day. Not as autocomplete, but as a team I direct. Here is the exact operating model I use, with the guardrails that keep the work understandable, reviewable and mine."
loop_h2 = "The operating model"
loop = [
  { step = "01", name = "Plan", body = "I write the intent, constraints and acceptance checks as a plan in plain TOML, before any code exists. The plan is the contract." },
  { step = "02", name = "Chunk", body = "The plan is cut into the smallest independent units: one function, one page, one config change. Each chunk carries its own validation gate." },
  { step = "03", name = "Dispatch", body = "A dispatcher sends each chunk to an AI worker in an isolated git worktree. Cheap, fast models take routine chunks; stronger models take hard ones." },
  { step = "04", name = "Validate", body = "Nothing is accepted on the model's word. Tests, builds, linters and policy checks run automatically; a failed gate isolates the failure to one small chunk." },
  { step = "05", name = "Approve", body = "I review the diff, merge it, and every change to production waits behind a human approval gate. The AI proposes; a person decides." },
]
principles_h2 = "Guardrails that make it work"
principles = [
  { name = "Shared context, not chat history", body = "Every agent reads the same project manifest: decisions, rules and current state live in the repo, not in someone's head or a chat window." },
  { name = "Least privilege by default", body = "Workers get only the tools a chunk needs. Cloud access uses short-lived OIDC identities instead of stored secrets." },
  { name = "Agent-agnostic", body = "The same configuration drives Claude Code, OpenCode, Pi and others, so the workflow outlives any single vendor. That's NXS rule one applied to AI." },
  { name = "Evidence over confidence", body = "Every recommendation cites a file, a command output or a source. Claims without evidence don't ship." },
]
proof_h2 = "Built this way"
proof_body = "This website, its infrastructure and the tools below were built with this model: plans and chunk specs are committed alongside the code, so you can see exactly how."
proof_links = [
  { label = "This site's source", href = "https://github.com/nex-ovia/infraflow-nex-ovia-site" },
  { label = "coderev", href = "https://github.com/srivastava-ami/coderev" },
  { label = "genome", href = "https://github.com/nex-ovia/genome" },
]
benefit_h2 = "What it gives me"
benefit = [
  "I ship as a leader without becoming a bottleneck: the agents do the typing, I do the deciding.",
  "Every change is small, tested and reversible, so speed doesn't turn into debt.",
  "Anyone, including non-developers, can read the plan and know what was built and why.",
]
cta_h2 = "Want this in your team?"
cta_body = "I talk about this on podcasts and in interviews, and I help teams set it up."
cta_primary = { label = "Work with me", href = "/work-with-me" }
cta_secondary = { label = "Read the Standard", href = "/standard" }
validate = "test -f ai/index.html && {validate_all}"

