# nex-ovia.com: project manifest. Always-loaded context is [context] + [rules] only.
# Everything else is pulled on demand through [pull]: load a key only when the task needs it.

[context]
purpose  = "PERSONAL BRAND, not a business: public, dated, verifiable record of Amit's work (trust over revenue). Identity: implementation leader & technical strategist; never 'project manager'; never offer services/advisory/paid work. Spec: docs/plans/brand-trust.chunks.toml; playbook docs/social/playbook.md"
what     = "nex-ovia.com brand hub: static site (hand-written HTML pages + content/*.toml) built by a Go tool, moving from Azure Static Web Apps to Cloudflare Pages via Terraform"
branch   = "dev: the working and deploy branch (Azure SWA deploys dev today; Cloudflare apply runs from dev)"
live     = "www.nex-ovia.com = Azure SWA (azure-static-web-apps.yml) behind Cloudflare DNS (proxied) until cutover (chunk C02)"
build    = "cd tools && go test ./...  ·  go build -o ../.nxsite ./nxsite && ../.nxsite build -root .. -out ../dist && ../.nxsite check -out ../dist"
infra    = "cd infra && terraform init -backend=false && terraform validate && terraform test   (8 offline tests)"
active   = "planned.brand-site BUILT on local branch brand-site; see its approval_stack (A1–A9)"
handoff  = "docs/HANDOFF.md: read first when resuming"
last_commit = "076ae97 content: humanized home, about (real career timeline), work-with-me, /ai; X profile in sameAs and footer (2026-11-23)"

[rules]
plan_first      = "write [planned.<name>] + an HTML review page; build only after an explicit 'yes'"
chunks          = "one function per chunk; tests ship in the same chunk; each chunk has a validate gate"
language        = "tools are written in Go (tools/ module, Go 1.24, deps pinned ≥ 2 weeks old)"
shell_output    = "redirect to .tmp/<cmd>.log; read back one summary line"
commits         = "no Co-Authored-By, no 'Generated with' lines; commit on dev; never push feature branches"
free_tiers      = "free tiers only: Cloudflare (Pages, DNS, WAF managed, Web Analytics), GitHub Actions, Azure Blob (state, cents), social developer APIs"
secrets         = "never paste secrets in chat or files; GitHub secrets via hidden prompts (gh secret set); Azure via OIDC (no secret)"
security        = "actions pinned by SHA; least-privilege permissions; planguard blocks deletes of DNS/Pages; gitleaks + actionlint + zizmor in CI"
excluded_input  = "nothing from helpshift-solutions"
context_hygiene = "use [pull] pointers and grep before reading whole files"

[pull]
handoff        = "docs/HANDOFF.md"
plan_chunks    = "docs/plans/nexovia-site.chunks.toml: read only the chunk ids being executed"
setup_guide    = "docs/setup.md (Cloudflare token, environments, cutover) · docs/social.md (LinkedIn/X/Instagram)"
terraform      = "infra/*.tf + infra/README.md; tests infra/tests/stack.tftest.hcl; CI scripts infra/scripts/{plan.sh,cf-env.sh}"
state_backend  = "Azure Blob (azurerm, OIDC): infra/backend.tf, scripts/azure-state.sh"
site_builder   = "tools/nxsite (load, layout, head/JSON-LD, feeds, blog, headers/CSP, card, check)"
social         = "tools/nxsocial (drafts, LinkedIn/X/Instagram publishers) + .github/workflows/social.yml"
shared_model   = "tools/content/post.go (blog post front matter, shared by nxsite + nxsocial)"
workflows      = ".github/workflows/{infra,site,security,social}.yml; legacy azure-static-web-apps.yml (delete at C04)"
coderev_plans  = "github.com/srivastava-ami/coderev dev: docs/plans/coderev-80-20.{html,chunks.toml}; manifest copy: docs/handoff/coderev.project_manifest.toml"
plan_pages     = "https://claude.ai/artifact/WDCq4KxoNxVF1hyuDfP8cr (site) · https://claude.ai/artifact/STwoYfQ3nnPtY1JnT7rN8G (coderev)"
seo_audit      = "2026-11-23 baseline: no sitemap, no canonical, og:url apex/www mismatch, no og:image/JSON-LD, JS-injected nav, no blog/RSS, Cloudflare robots.txt blocking AI bots. All fixed in the nxsite build (live after cutover)"

[planned.nexovia-site]
status    = "in-progress. Done + CI green: I01–I09, S01–S08, P01–P03, X01–X05. User done: CF_ACCOUNT_ID var, CLOUDFLARE_API_TOKEN secret, environments. Next: U3 Azure state (scripts/azure-state.sh) → first plan/apply → C01–C04"
repo      = "nex-ovia/infraflow-nex-ovia-site"
decisions = [
  "free tiers only; Terraform state in Azure Blob via GitHub OIDC (R2 dropped: needs a card)",
  "host: Cloudflare Pages (direct upload via wrangler 4.159.0 in CI); Azure SWA kept 7 days after cutover for rollback",
  "pipeline: PR = checks + guarded plan + preview; dev push = plan → apply after 'production' approval",
  "Cloudflare needs only CF_ACCOUNT_ID (var) + CLOUDFLARE_API_TOKEN (secret); zone ID derived at runtime",
  "AI crawlers: allow search, assistant and training bots (ai_crawlers = allow_all)",
  "blog at www.nex-ovia.com/blog; social = LinkedIn, X, Instagram: drafts always, auto opt-in per post",
]
next = [
  "U3  user: LOCATION=eastus bash scripts/azure-state.sh, then re-run latest infra run",
  "C00 review first terraform plan (expect creates only; planguard must pass) → user approves apply",
  "C01 site workflow deploys dist → verify https://nexovia-site.pages.dev (Playwright 390/1280, headers, robots, sitemap, feed, links)",
  "C02 cutover: cutover = true in infra/env/prod.tfvars → plan (only www[0] replace allowed; apex is always managed) → approve",
  "C03 Search Console + Bing verification TXT via Terraform; user submits sitemap",
  "C04 after 7 clean days: delete Azure SWA resource + azure-static-web-apps.yml",
  "W05 add coderev card to tools/index.html + content/site.toml [[tool]] (already in JSON-LD)",
]

[planned.apex-always-on]
status   = "A1–A3 done (Haiku via agent-dispatcher, validated: terraform test 8/8, go test cfimport); committing to dev; next A4 plan → user approval → verify apex 301"
why      = "bare nex-ovia.com had no DNS record (apex gated on cutover) so the live apex->www 301 rule (infra/rules.tf) never fired; apex must redirect to www before and after cutover, and all metadata URLs (canonical/og/sitemap = https://www.nex-ovia.com) must resolve"
done_pre = "U3 azure-state.sh run (az 2.86 lacks --default-to-oauth-authentication: flag dropped); token perms fixed; first apply ran (1 import, 22 add, 0 destroy); production env now requires srivastava-ami approval (it had none)"
chunks = [
  "A1 infra/dns.tf: drop count on cloudflare_dns_record.apex (always proxied AAAA 100::); infra/tests/stack.tftest.hcl: pre-cutover asserts apex exists+proxied, www unmanaged; cutover asserts apex.proxied. validate: terraform test",
  "A2 tools/cfimport/main.go dnsTarget: adopt apex A/AAAA/CNAME regardless of cutover as cloudflare_dns_record.apex; main_test.go updated. validate: go test ./cfimport/",
  "A3 infra/scripts/plan.sh: replace allow-list = www[0] only. validate: grep",
  "A4 (Claude) push to dev, review plan (expect 1 add: apex), user approves; verify apex 301 for /, /robots.txt, /sitemap.xml, /feed.xml, /llms.txt, query string preserved",
]

